name: Auto Price Bot

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          persist-credentials: true

      # Set up Python BEFORE installing packages so Playwright is installed
      # into the same Python environment that runs main.py.
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests pytz jdatetime playwright

      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      - name: Run script
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        run: python main.py

      - name: Save daily price baseline
        run: |
          if [[ -n "$(git status --porcelain -- price_baseline.json)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add price_baseline.json
            git commit -m "Update daily price baseline"
            git push
          else
            echo "No baseline changes to save."
          fi
